name: Build Windows App

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Project and Build
        run: |
          # اجبار ابزارهای بیلد به انتخاب Visual Studio 2022
          $env:VSINSTALLDIR = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\"
          $env:CMAKE_GENERATOR = "Visual Studio 17 2022"
          
          flutter config --enable-windows-desktop
          flutter create --platforms=windows my_app
          Copy-Item -Path "lib\main.dart" -Destination "my_app\lib\main.dart" -Force
          cd my_app
          flutter build windows --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuadraticSolver_Windows
          path: my_app/build/windows/x64/runner/Release/
